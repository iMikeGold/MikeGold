<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">AudioRii Bracket Flow logo</title>
  <desc id="desc">A metallic AudioRii wordmark enclosed by two open signal-flow brackets, with cyan input and warm-white output nodes, on a transparent background.</desc>

  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset="0.22" stop-color="#aab4bc"/>
      <stop offset="0.5" stop-color="#f0f4f7"/>
      <stop offset="0.73" stop-color="#6c7680"/>
      <stop offset="1" stop-color="#d9e0e5"/>
    </linearGradient>

    <linearGradient id="leftFlow" x1="118" y1="310" x2="345" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fd9fb"/>
      <stop offset="1" stop-color="#bfefff"/>
    </linearGradient>

    <linearGradient id="rightFlow" x1="1255" y1="310" x2="1482" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#ffd8aa"/>
    </linearGradient>

    <radialGradient id="cyanNode">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#d7f8ff"/>
      <stop offset="1" stop-color="#68d6f4"/>
    </radialGradient>

    <radialGradient id="warmNode">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#fff5e7"/>
      <stop offset="1" stop-color="#ffd09a"/>
    </radialGradient>

    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- left bracket / signal input -->
  <path d="M345 162
           H286
           Q250 162 250 198
           V274
           H118"
        fill="none" stroke="url(#leftFlow)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M118 346
           H250
           V422
           Q250 458 286 458
           H345"
        fill="none" stroke="url(#leftFlow)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right bracket / signal output -->
  <path d="M1255 162
           H1314
           Q1350 162 1350 198
           V274
           H1482"
        fill="none" stroke="url(#rightFlow)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1482 346
           H1350
           V422
           Q1350 458 1314 458
           H1255"
        fill="none" stroke="url(#rightFlow)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- centre route -->
  <path d="M118 310 H1482" fill="none" stroke="#d8eef7" stroke-opacity="0.18" stroke-width="18" filter="url(#glow)"/>
  <path d="M118 310 H1482" fill="none" stroke="url(#leftFlow)" stroke-width="5" opacity="0.85"/>

  <!-- nodes -->
  <circle cx="118" cy="310" r="12" fill="url(#cyanNode)" filter="url(#glow)"/>
  <circle cx="1482" cy="310" r="12" fill="url(#warmNode)" filter="url(#glow)"/>

  <!-- vector wordmark -->
