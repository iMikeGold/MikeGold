.000 L1059.920,312.438 L1104.625,312.438 C1107.070,312.438 1109.390,312.314 1111.710,312.190 L1153.557,390.000 L1174.771,390.000 L1130.521,308.544 C1154.345,300.671 1166.774,280.991 1166.774,255.220 C1166.774,221.162 1145.271,197.090 1104.460,197.090 L1041.565,197.090 L1041.565,390.000 Z M1059.920,295.865 L1059.920,213.539 L1103.714,213.539 C1133.753,213.539 1148.503,229.946 1148.503,255.220 C1148.503,280.079 1133.753,295.865 1103.838,295.865 L1059.920,295.865 Z M1206.358,390.000 L1223.967,390.000 L1223.967,245.235 L1206.358,245.235 L1206.358,390.000 Z M1215.183,218.428 C1222.309,218.428 1228.110,213.000 1228.110,206.122 C1228.110,199.286 1222.309,193.858 1215.183,193.858 C1208.181,193.858 1202.380,199.286 1202.380,206.122 C1202.380,213.000 1208.181,218.428 1215.183,218.428 Z M1268.248,390.000 L1285.857,390.000 L1285.857,245.235 L1268.248,245.235 L1268.248,390.000 Z M1277.073,218.428 C1284.199,218.428 1290.000,213.000 1290.000,206.122 C1290.000,199.286 1284.199,193.858 1277.073,193.858 C1270.071,193.858 1264.270,199.286 1264.270,206.122 C1264.270,213.000 1270.071,218.428 1277.073,218.428 Z" fill="url(#metal)"/>
</svg>
