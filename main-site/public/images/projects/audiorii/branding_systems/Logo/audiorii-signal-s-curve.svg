<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="620" viewBox="0 0 1700 620" role="img" aria-labelledby="title desc">
  <title id="title">AudioRii Signal S Curve logo</title>
  <desc id="desc">A metallic AudioRii wordmark crossed by layered signal paths forming a continuous S curve, isolated on a transparent background.</desc>

  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.2" stop-color="#aeb8c0"/>
      <stop offset="0.48" stop-color="#eff5f8"/>
      <stop offset="0.72" stop-color="#68747e"/>
      <stop offset="1" stop-color="#dbe4e9"/>
    </linearGradient>

    <linearGradient id="signal" x1="90" y1="320" x2="1570" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ce2ff"/>
      <stop offset="0.42" stop-color="#b8eaff"/>
      <stop offset="0.7" stop-color="#9baeff"/>
      <stop offset="1" stop-color="#eeeaff"/>
    </linearGradient>

    <radialGradient id="node">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#d9f8ff"/>
      <stop offset="1" stop-color="#67d5f2"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- faint atmospheric glow -->
  <path d="M90 310
           H300
           C390 310 410 235 500 235
           H710
           C800 235 820 385 925 385
           H1105
           C1200 385 1220 310 1310 310
           H1570"
        fill="none" stroke="#85dcfa" stroke-opacity="0.18"
        stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>

  <!-- layered S-curve signal paths -->
  <path d="M90 310
           H300
           C390 310 410 235 500 235
           H710
           C800 235 820 385 925 385
           H1105
           C1200 385 1220 310 1310 310
           H1570"
        fill="none" stroke="url(#signal)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M300 280
           C385 280 415 210 500 210
           H720
           C820 210 835 360 930 360
           H1110"
        fill="none" stroke="url(#signal)" stroke-width="4"
        stroke-opacity="0.72" stroke-linecap="round"/>

  <path d="M300 340
           C390 340 415 260 505 260
           H700
           C790 260 815 410 925 410
           H1110"
        fill="none" stroke="url(#signal)" stroke-width="4"
        stroke-opacity="0.55" stroke-linecap="round"/>

  <path d="M350 300
           C420 300 440 255 520 255
           H680
           C770 255 790 365 885 365
           H1040"
        fill="none" stroke="#d8edff" stroke-width="2.5"
        stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- endpoints -->
  <circle cx="90" cy="310" r="12" fill="url(#node)" filter="url(#glow)"/>
  <circle cx="1570" cy="310" r="10" fill="#e9ecff" filter="url(#glow)"/>

  <!-- vector wordmark -->
