<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">AudioRii Flow Arc logo</title>
  <desc id="desc">A metallic AudioRii wordmark beneath a continuous pale-blue signal arc, isolated on a transparent background.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.22" stop-color="#9ca9b3"/>
      <stop offset="0.48" stop-color="#eef4f7"/>
      <stop offset="0.72" stop-color="#65727d"/>
      <stop offset="1" stop-color="#d7e0e6"/>
    </linearGradient>
    <linearGradient id="arc" x1="105" y1="390" x2="1275" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#75dfff"/>
      <stop offset="0.48" stop-color="#bfeeff"/>
      <stop offset="0.82" stop-color="#8acdf0"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <radialGradient id="node">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#d8f6ff"/>
      <stop offset="1" stop-color="#74cfea"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- signal path -->
  <path d="M105 385
           C 310 170, 610 115, 845 190
           C 1000 238, 1117 307, 1248 280"
        fill="none" stroke="#82d9f7" stroke-opacity="0.22" stroke-width="18"
        stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M105 385
           C 310 170, 610 115, 845 190
           C 1000 238, 1117 307, 1248 280"
        fill="none" stroke="url(#arc)" stroke-width="7"
        stroke-linecap="round"/>

  <!-- route nodes -->
  <circle cx="105" cy="385" r="11" fill="url(#node)" filter="url(#softGlow)"/>
  <circle cx="1248" cy="280" r="12" fill="url(#node)" filter="url(#softGlow)"/>
  <circle cx="1281" cy="297" r="8" fill="#d8f5ff"/>
  <circle cx="1310" cy="293" r="10" fill="#f2fbff"/>

