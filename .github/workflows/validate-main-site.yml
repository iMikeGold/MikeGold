name: Validate main site

on:
  pull_request:
    paths:
      - "main-site/**"
      - ".github/workflows/validate-main-site.yml"
  push:
    branches:
      - main
      - agent/featured-project-case-studies
      - agent/refine-project-showcases
      - agent/regenerate-refined-project-indexes
    paths:
      - "main-site/**"
      - ".github/workflows/validate-main-site.yml"

permissions:
  contents: write

concurrency:
  group: validate-main-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate records and knowledge
        run: npm run records:check

      - name: Typecheck services
        run: npm run services:typecheck

      - name: Build Next.js application
        run: npm run build

      - name: Commit regenerated indexes
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/regenerate-refined-project-indexes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records/generated src/system/generated
          if ! git diff --cached --quiet; then
            git commit -m "regenerate refined project indexes"
            git push
          fi
